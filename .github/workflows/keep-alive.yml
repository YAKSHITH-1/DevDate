name: DevDate Server Keep-Alive

on:
  schedule:
    # Runs every 14 minutes automatically to prevent Render free-tier instance sleep
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

# Minimum required permissions
permissions: {}

jobs:
  ping-server:
    name: Keep-Alive 14-Min Ping
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Health Endpoint
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
        run: |
          if [ -z "$KEEP_ALIVE_URL" ]; then
            echo "❌ Error: KEEP_ALIVE_URL secret is not configured in GitHub Repository Secrets."
            echo "Please configure KEEP_ALIVE_URL under Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Pinging configured health check endpoint..."
          
          # Send lightweight request with 15s timeout without printing secret URL to logs
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$KEEP_ALIVE_URL")
          echo "Response HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Keep-alive ping successful! Server is awake."
            exit 0
          else
            echo "⚠️ Health check returned HTTP status $HTTP_STATUS"
            exit 1
          fi
